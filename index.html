<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Background Generator</title>
        <link rel="stylesheet" type="text/css" href="./style.css" />
    </head>
    <body>
        <header class="header">
            <h1>Background Generator</h1>
        </header>
        <div class="background-setting-section">
            <div class="gradient-direction-menu-wrapper">
                <label for="gradient-direction-menu">Gradient Direction</label>
                <select
                    name="gradient-direction-menu"
                    id="gradient-direction-menu"
                    class="gradient-direction-menu"
                >
                    <option value="top">To Top</option>
                    <option value="right" selected>To Right</option>
                    <option value="bottom">To Bottom</option>
                    <option value="left">To Left</option>
                </select>
            </div>
            <div class="color-pickers-container">
                <div class="color-picker-wrapper">
                    <label for="color-picker-1">Colour 1</label>
                    <input
                        class="color-picker"
                        type="color"
                        name="color-picker-1"
                        id="color-picker-1"
                        value="#ff0000"
                    />
                </div>
                <div class="color-picker-wrapper">
                    <label for="color-picker-2">Colour 2</label>
                    <input
                        class="color-picker"
                        type="color"
                        name="color-picker-2"
                        id="color-picker-2"
                        value="#ffff00"
                    />
                </div>
            </div>
            <button id="random-picker" type="button">Pick For Me!</button>
        </div>
        <div class="color-code-section">
            <h3>Your Background Colour Code</h3>
            <div class="color-code-box">
                <p id="color-code" class="color-code">
                    background-image: linear-gradient(to right, #FF0000,
                    #FFFF00);
                </p>
            </div>
            <p id="cta-info" class="cta-info">
                Click to copy to your clipboard!
            </p>
        </div>
        <script type="text/javascript" src="./script.js"></script>
    </body>
</html>
